# /etc/nginx/sites-available/mufasil.site
# Static Astro build in /var/html/mufasil-site-astro, plus the contact form service on 127.0.0.1:8787.
# The old Next.js site (pm2 "mufasil.site" on :3210) is no longer proxied, but its files stay in /var/html/mufasil.site.

# HTTP -> HTTPS (apex + www)
server {
    listen 80;
    listen [::]:80;
    server_name mufasil.site www.mufasil.site;
    return 301 https://mufasil.site$request_uri;
}

# www HTTPS -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.mufasil.site;

    ssl_certificate /etc/letsencrypt/live/mufasil.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mufasil.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mufasil.site$request_uri;
}

# Main site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mufasil.site;

    ssl_certificate /etc/letsencrypt/live/mufasil.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mufasil.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/html/mufasil-site-astro;
    index index.html;

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml application/manifest+json;
    gzip_min_length 256;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    error_page 404 /404.html;

    # Pages: always revalidate, so a new deploy shows up straight away.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Hashed build assets never change, so cache them for a year.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /404.html {
        internal;
    }

    # Contact form -> Node service. Behind Cloudflare, the visitor's IP is in CF-Connecting-IP.
    location = /api/contact {
        limit_except POST OPTIONS { deny all; }
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_read_timeout 20s;
    }
    location = /api/contact/health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }
}
